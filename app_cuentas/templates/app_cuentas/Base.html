<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>



    <title>{% block title %} Inicio {% endblock %}</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            background-color: #f4f6f8;
        }

        .sidebar {
            width: 220px;
            background-color: #2563eb;
            color: white;
            padding: 20px;
           position: sticky;
            height: 100%; 
        }

        .sidebar h2 {
            margin-bottom: 30px;
            font-size: 18px;
            text-align: center;
        }

        .sidebar a {
            display: block;
            color: white;
            text-decoration: none;
            margin: 15px 0;
            padding: 10px;
            border-radius: 6px;
        }

        .sidebar a:hover {
            background-color: #2563eb;
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            height: 60px;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            border-bottom: 1px solid #e5e7eb;
        }

        .navbar .user {
            font-weight: bold;
        }

        .navbar a {
            text-decoration: none;
            color: #dc2626;
            font-size: 14px;
        }

        .content {
            padding: 30px;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>Mi Sistema</h2>
        <a href="{% url 'home' %}">Home</a>

        <a href="{% url 'usuarios' %}">Usuarios</a>
        <a href="{% url 'usuarios_etb' %}">Usuarios Etb</a>

      
    </div>

    <div class="main">

        <div class="navbar">
            <div>Dashboard</div>
            <div class="user">
                {{ request.user.username }} |
                <a href="{% url 'logout' %}">Cerrar sesión</a>
            </div>
        </div>


        <div class="content">
            {% if messages %}
              {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">
                  {{ message }}
                </div>
              {% endfor %}
            {% endif %}
        
            {% block content %}{% endblock %}
        </div>
        

    </div>

</body>
</html>
