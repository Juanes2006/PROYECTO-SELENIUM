<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %} Inicio {% endblock %}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            background-color: #f4f6f8;
        }

        .sidebar {
            width: 220px;
            background-color: #1e293b;
            color: white;
            padding: 20px;
        }

        .sidebar h2 {
            margin-bottom: 30px;
            font-size: 18px;
            text-align: center;
        }

        .sidebar a {
            display: block;
            color: white;
            text-decoration: none;
            margin: 15px 0;
            padding: 10px;
            border-radius: 6px;
        }

        .sidebar a:hover {
            background-color: #334155;
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            height: 60px;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            border-bottom: 1px solid #e5e7eb;
        }

        .navbar .user {
            font-weight: bold;
        }

        .navbar a {
            text-decoration: none;
            color: #dc2626;
            font-size: 14px;
        }

        .content {
            padding: 30px;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>Mi Sistema</h2>
        <a href="{% url 'home' %}">Home</a>

        <a href="{% url 'usuarios' %}">Usuarios</a>

      
    </div>

    <div class="main">

        <div class="navbar">
            <div>Dashboard</div>
            <div class="user">
                {{ request.user.username }} |
                <a href="{% url 'logout' %}">Cerrar sesión</a>
            </div>
        </div>


        <div class="content">
            {% block messages %} {% endblock %}
          {% block content %}
          {% endblock %}
        </div>

    </div>

</body>
</html>
